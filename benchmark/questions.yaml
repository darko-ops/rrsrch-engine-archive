- id: vs-placebo
  kind: comparator
  question: How do MSCs compare with placebo injection?
  scope:
    comparator:
    - placebo
    months: 12
  expected:
    verdict: mixed
    answer: Against placebo, 12-month pain was slightly lower (about 1 point on a 10-point VAS, below a clinically
      important difference, very low certainty) and WOMAC did not differ.
    points:
    - Pain is slightly lower than placebo at 12 months
    - The pain difference is below a clinically important difference
    - WOMAC does not differ from placebo
    - Certainty is very low
