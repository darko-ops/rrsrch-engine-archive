# The rrsrch v1 benchmark: questions about MSC therapy for knee osteoarthritis,
# with expected answers taken from the eight meta-analyses in the answer key
# (corpus/manifest.yaml).
#
# rrsrch never reads the meta-analyses. It answers from the studies they
# included, and its answers are scored against these:
#   verdict   what the evidence shows: benefit, no_difference, harm, safe,
#             mixed (differs by outcome or comparator), contested (the
#             meta-analyses disagree) or uncertain (too little to say).
#   points    what a complete answer must say. Coverage is the share of
#             points an answer makes.
#   support   the answer-key findings behind the expected answer. Each quote
#             is copied from its meta-analysis verbatim, and
#             `rrsrch bench check` proves it. `effect` is what the pooled
#             statistic shows, which is not always what the authors' words
#             say; `note` records where they differ.
#
# The questions and answers were drafted from findings extracted from the
# meta-analyses' text (tables and figures excluded) and need review by a
# domain researcher before the numbers they produce are published.

version: 1
questions:

- id: pain-12m
  kind: efficacy
  question: Do intra-articular MSC injections reduce knee osteoarthritis pain at 12 months compared with a control
    treatment?
  scope:
    outcome:
    - vas_pain
    months: 12
  expected:
    verdict: benefit
    answer: 'Yes. Every meta-analysis that pooled 12-month pain against a control found lower pain with MSCs, but
      the size depends on the control: about 1 point on a 10-point VAS against placebo, about 2 against hyaluronic
      acid, and the certainty is low to very low.'
    points:
    - Pain is lower with MSCs than with control at 12 months
    - The difference against placebo is small (about 1 of 10 VAS points), below a clinically important difference
    - The difference against hyaluronic acid is larger (about 2 of 10 VAS points)
    - Certainty of the evidence is low or very low
  support:
  - meta: '33407686'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: 'WMD = − 7.04, 95%CI: − 13.63, − 0.45, P = 0.036'
    where: results
    quote: '12-month: WMD = − 7.04, 95%CI: − 13.63, − 0.45, P = 0.036'
  - meta: '39360004'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: 1.91 lower pain VAS score (95 % CI -3.23 to -0.59; p < 0.00001)
    certainty: very low
    where: abstract
    quote: Meta-analyses data showed that, compared to viscosupplementation (VS), advanced MSC therapy resulted
      in a 1.91 lower pain VAS score (95 % CI -3.23 to -0.59; p < 0.00001) for the treatment of knee OA after 12
      months.
  - meta: '39360004'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: MD ‐0.99 (95 % CI ‐1.94 to −0.03)
    where: results
    quote: 'In the longer-term available (period of 12 months), pooled results showed MSC was associated with lower
      pain VAS scores: MD ‐0.99 (95 % CI ‐1.94 to −0.03).'
  - meta: '40055739'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: MD = 16.21, 95% CI = (7.38, 25.04), P = 0.0003
    where: results
    quote: MSCs significantly improved the 12-month VAS in patients with OA [MD = 16.21, 95% CI = (7.38, 25.04),
      P = 0.0003] (Fig. 7B).
  - meta: '40407910'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: SMD − 0.952; 95% CI − 1.491 to − 0.413; p = 0.001, I2 = 58%
    where: results
    quote: The pooled estimate demonstrated significant between group differences in favour of MSC (SMD − 0.952;
      95% CI − 1.491 to − 0.413; p = 0.001, I2 = 58%; Supplementary Fig. 4).
  - meta: '41013772'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: SMD = − 0.90, 95% CI − 1.57 to − 0.23; low certainty
    certainty: low
    where: results
    quote: The network forest plot showed that, compared to the conventional therapy group, repeated MSC injection
      may effectively reduce the VAS score at 12 months (SMD = − 0.90, 95% CI − 1.57 to − 0.23; low certainty) (Fig. 14E).
  - meta: '36601089'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: Mean difference = −26.95, 95% CI (−29.78 to −24.13); P < 0.00001
    where: results
    quote: A similar statistically significant reduction was seen after 12 months as well [Mean difference = −26.95,
      95% CI (−29.78 to −24.13); P < 0.00001; Figure 4].

