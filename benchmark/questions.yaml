  scope:
    outcome:
    - womac
    months: 12
  expected:
    verdict: contested
    answer: 'The meta-analyses disagree: three found significantly better WOMAC totals, while three found no difference,
      including the comparison against placebo.'
    points:
    - Evidence on 12-month WOMAC total is split
    - Against placebo, WOMAC total did not differ
    - Several pooled analyses against mixed controls found better WOMAC with MSCs
  support:
