  - meta: '39360004'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: 0.99 lower pain VAS points (95 % CI -1.94 to -0.03; p = 0.76)
    certainty: very low
    where: abstract
    quote: Compared to placebo, the difference was 0.99 lower pain VAS points (95 % CI -1.94 to -0.03; p = 0.76).
      According to the GRADE approach, the evidence was very uncertain for both comparisons.
    note: The abstract p = 0.76 contradicts its own CI (-1.94 to -0.03); it is likely the heterogeneity p.
  - meta: '39360004'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: MD ‐0.99 (95 % CI ‐1.94 to −0.03)
    where: results
