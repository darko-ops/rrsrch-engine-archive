- id: vs-hyaluronic-acid
  kind: comparator
  question: Are MSCs better than hyaluronic acid injection?
  scope:
    comparator:
    - hyaluronic_acid
    months: 12
  expected:
    verdict: benefit
    answer: Probably, for pain. At 12 months VAS pain was about 1.5 to 2 points lower and WOMAC about 7 to 8 points
      lower than with viscosupplementation. Excluding high risk-of-bias trials raised the pain finding to moderate
      certainty; the WOMAC difference is below a clinically important difference.
    points:
    - Pain is lower with MSCs than with hyaluronic acid at 12 months
    - Excluding high risk-of-bias trials, the pain benefit holds with moderate certainty
    - The WOMAC difference is below a clinically important difference
  support:
  - meta: '39360004'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: MD ‐1.91 (95 % CI ‐3.23 to −0.59)
    where: results
    quote: 'In the longer-term available (period of 12 months), pooled results showed MSC was associated with lower
      pain VAS scores: MD ‐1.91 (95 % CI ‐3.23 to −0.59).'
  - meta: '39360004'
    outcome: womac
    months: 12
