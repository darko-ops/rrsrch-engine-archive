- id: pain-vs-function
  kind: efficacy
  question: Does the pain relief from MSCs come with better knee function?
  scope:
    outcome:
    - vas_pain
    - womac_function
  expected:
    verdict: mixed
    answer: Not clearly. Against other injectable treatments, MSCs reduced pain at every time point but WOMAC function,
      stiffness and most KOOS subscales did not differ.
    points:
    - Pain improves more consistently than function
    - Function scores often show no difference from control even when pain does
    - Pain relief does not by itself show better knee function
  support:
  - meta: '40407910'
    outcome: vas_pain
    months: 12
    effect: benefit
    estimate: SMD − 0.952; 95% CI − 1.491 to − 0.413; p = 0.001, I2 = 58%
    where: results
    quote: The pooled estimate demonstrated significant between group differences in favour of MSC (SMD − 0.952;
      95% CI − 1.491 to − 0.413; p = 0.001, I2 = 58%; Supplementary Fig. 4).
  - meta: '40407910'
    outcome: womac_function
    months: 12
    effect: no_difference
    estimate: SMD 0.117, 95% CI − 0.214 to 0.448; p = 0.488, I2 = 0%
    where: results
    quote: The pooled estimate did not demonstrate significant between group differences (SMD 0.117, 95% CI − 0.214
      to 0.448; p = 0.488, I2 = 0%; Supplementary Fig. 22).
  - meta: '40407910'
    outcome: other
    months: null
    effect: no_difference
    where: conclusion
    quote: These differences were not reflected in clinical and functional outcomes, indicating that the observed
      reduction in pain did not correspond to substantial improvements in knee functionality.
  - meta: '40407910'
    outcome: other
    months: null
    effect: mixed
    where: conclusion
    quote: The results of this meta-analysis demonstrated a significant effect of adipose and bone marrow-derived
      stromal cell (MSC) injections on pain reduction at all assessed time points, and MSC injections showed superiority
      over other non-surgical treatment options.

