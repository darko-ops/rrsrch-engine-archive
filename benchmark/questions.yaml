- id: pain-3m
  kind: efficacy
  question: Do MSCs reduce knee pain within the first 3 months?
  scope:
    outcome:
    - vas_pain
    months: 3
  expected:
    verdict: contested
    answer: The meta-analyses disagree. One found no significant difference at 3 months (VAS WMD -1.13, p = 0.097);
      another, pooling against other injectable biologics, found a significant reduction.
    points:
    - Evidence at 3 months is split
    - At least one pooled analysis found no significant pain difference at 3 months
    - At least one found lower pain with MSCs at 3 months
  support:
  - meta: '33407686'
    outcome: vas_pain
    months: 3
    effect: no_difference
    estimate: 'WMD = − 1.13, 95%CI: − 2.46, 0.20, P = 0.097'
    where: results
    quote: '3 month: WMD = − 1.13, 95%CI: − 2.46, 0.20, P = 0.097'
  - meta: '40407910'
    outcome: vas_pain
    months: 3
    effect: benefit
    estimate: SMD − 0.526; 95% CI − 0.713 to − 0.339, p = 0.0001, I2 = 64%
    where: results
    quote: The pooled estimate demonstrated significant between group differences in favour of MSC (SMD − 0.526;
      95% CI − 0.713 to − 0.339, p = 0.0001, I2 = 64%; Fig. 1).

- id: durability-24m
  kind: durability
  question: Does the benefit of MSC injection last to 24 months?
  scope:
    months: 24
  expected:
    verdict: uncertain
    answer: 'Unclear. Only one meta-analysis pooled 24-month results against control: pain favoured MSCs, but IKDC
      function did not differ. Most trials stop at 12 months.'
    points:
    - Few trials follow patients beyond 12 months
    - One pooled 24-month pain result favours MSCs
    - Function (IKDC) at 24 months did not differ from control
  support:
  - meta: '33407686'
    outcome: vas_pain
    months: 24
    effect: benefit
    estimate: 'WMD = − 24.98, 95%CI: − 35.01, − 14.96, P < 0.001'
    where: results
    quote: '24-month: WMD = − 24.98, 95%CI: − 35.01, − 14.96, P < 0.001'
    note: The 24-month WMD of -24.98 is far larger than the 12-month -7.04, which suggests 0-10 and 0-100 VAS scales
      were pooled as raw differences.
  - meta: '33407686'
    outcome: ikdc
    months: 24
    effect: no_difference
    estimate: 'WMD = 5.24, 95%CI: − 0.92, 11.40, P = 0.095'
    where: results
    quote: '24-month: WMD = 5.24, 95%CI: − 0.92, 11.40, P = 0.095'

- id: function-12m
  kind: efficacy
  question: Do MSCs improve knee function at 12 months compared with control?
  scope:
    outcome:
    - womac_function
    months: 12
  expected:
    verdict: contested
    answer: The meta-analyses disagree. Two found better WOMAC function at 12 months; two found no significant difference.
      Function improves less consistently than pain.
    points:
    - Evidence on 12-month function is split
    - Some pooled analyses found better WOMAC function with MSCs
    - Others found no significant function difference
    - Function benefit is less consistent than pain benefit
